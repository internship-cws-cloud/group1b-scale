
name: plan

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Temporary diagnostics for the S3 Terraform backend.
      - name: Diagnose AWS backend access
        run: |
          echo "=== AWS caller identity ==="
          aws sts get-caller-identity

          echo "=== S3 bucket access ==="
          aws s3api head-bucket \
            --bucket group1b-tfstate-598886663596

          echo "=== Terraform state object access ==="
          aws s3api head-object \
            --bucket group1b-tfstate-598886663596 \
            --key infra/terraform.tfstate

          echo "=== Terraform state prefix listing ==="
          aws s3api list-objects-v2 \
            --bucket group1b-tfstate-598886663596 \
            --prefix infra/ \
            --query 'Contents[].{Key:Key,Size:Size,Modified:LastModified}' \
            --output table

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - run: terraform init
      - run: terraform fmt -check
      - run: terraform validate

      # -lock=false because the plan role is read-only and cannot
      # write a lock row. Safe here: a plan changes nothing.
      - run: |
          terraform plan -no-color -lock=false \
            -var-file=ci.tfvars \
            -var="image_tag=${{ github.sha }}"
